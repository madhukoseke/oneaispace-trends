<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230B0D10'/%3E%3Ccircle cx='16' cy='16' r='5' fill='%234A8DF0'/%3E%3C/svg%3E"
    />
    <link rel="manifest" href="/manifest.json" />
    <meta
      name="description"
      content="OneAISpace Trends - a calm, dense feed of AI creations, research and resources, catalogued from their original public sources."
    />
    <meta name="theme-color" content="#08090A" />
    <title>OneAISpace Trends</title>
    <script>
      (function () {
        try {
          var stored = window.localStorage.getItem("oneaispace-theme");
          var theme = stored === "light" ? "light" : "dark";
          document.documentElement.classList.toggle("dark", theme === "dark");
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#08090A" : "#FAFAFA");
        } catch (error) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
